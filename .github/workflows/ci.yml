name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  typecheck-test-build:
    name: Typecheck / Test / Build
    runs-on: ubuntu-latest
    env:
      DATABASE_PATH: /tmp/kanban-smoke/app.db
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit & API integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Boot smoke test (real SQLite file + API + static hosting)
        run: |
          set -euo pipefail
          node apps/server/dist/index.js &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health > /dev/null; then break; fi
            sleep 0.5
          done
          echo "-- health:"
          curl -s http://127.0.0.1:3000/api/health
          echo ""
          echo "-- create task:"
          curl -s -X POST http://127.0.0.1:3000/api/tasks \
            -H 'content-type: application/json' \
            -d '{"title":"CI 冒烟任务","priority":"high","dueDate":"2099-01-01"}'
          echo ""
          echo "-- stats:"
          curl -s http://127.0.0.1:3000/api/stats
          echo ""
          echo "-- invalid input (expect 400):"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3000/api/tasks \
            -H 'content-type: application/json' -d '{"title":""}')
          test "$code" = "400"
          echo "-- frontend (SPA fallback):"
          curl -s http://127.0.0.1:3000/ | head -c 120
          echo ""
          kill "$SERVER_PID"
